name: Build standalone DLL

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Match Phase's shipping ABI/toolchain: VS 2022 STL + clang-cl/MSVC ABI.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MCBE-ImGui-Tess
          path: build/bin/Release/MCBE-ImGui-Tess.dll
