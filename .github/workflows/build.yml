name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake --preset vs2022-clangcl
      - name: Build Release
        shell: pwsh
        run: cmake --build --preset release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MCBE-ImGui-Tess
          path: build/bin/Release/MCBE-ImGui-Tess.dll
